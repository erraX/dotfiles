[ui]
agent_panel_sort = "spaces"
tab_bar_right = [
  { type = "datetime", format = "%H:%M" },
  { type = "command", command = "/Users/mni/.config/herdr/agent-elapsed-tracker.sh", interval_seconds = 10, timeout_seconds = 2 },
  { type = "command", command = "/Users/mni/.config/herdr/zoom-status.sh", interval_seconds = 1, timeout_seconds = 1 },
]
tab_bar_right_separator = "  "
prompt_new_tab_name = false
window_title = "{workspace} · {tab}"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#708089", dim = false }],
  [
    { token = "agent", fg = "#5c6a72", dim = false },
    { token = "$profile", fg = "#2e7099", dim = false },
    { token = "$elapsed", fg = "#47661b", bold = true, dim = false },
  ],
]

[terminal]
new_cwd = "follow"

[theme]
# Everforest Light Soft; backgrounds follow upstream with darker TUI accents.
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#e5dfc5"
panel_bg = "#f3ead3"
active_row_bg = "#d8d3ba"
selection_bg = "#e1e4bd"
surface0 = "#eae4ca"
surface1 = "#e5dfc5"
surface_dim = "#e5dfc5"
overlay0 = "#708089"
overlay1 = "#939f91"
text = "#5c6a72"
subtext0 = "#708089"
accent = "#2e7099"
mauve = "#8f537f"
green = "#47661b"
yellow = "#8c5a00"
red = "#ad3b4a"
blue = "#2e7099"
teal = "#2c7459"
peach = "#9a5200"

[keys]
prefix = "ctrl+g"
settings = "prefix+semicolon"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+a"
rename_workspace = "prefix+m"
close_workspace = "prefix+d"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
previous_agent = "ctrl+shift+k"
next_agent = "ctrl+shift+j"
focus_agent = "prefix+alt+1..9"
new_tab = "prefix+n"
rename_tab = "prefix+comma"
previous_tab = "ctrl+shift+tab"
next_tab = "ctrl+tab"
switch_tab = "prefix+1..9"
close_tab = ""
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+p"
resize_mode = "prefix+r"
resize_pane_left = "prefix+left"
resize_pane_down = "prefix+down"
resize_pane_up = "prefix+up"
resize_pane_right = "prefix+right"

[experimental]
switch_ascii_input_source_in_prefix = true

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.clipboard]
enabled = true
position = "top-right"

[ui.sound]
enabled = false
