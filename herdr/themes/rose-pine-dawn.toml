[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#797593", dim = false }],
  [
    { token = "agent", fg = "#464261", dim = false },
    { token = "$profile", fg = "#286983", dim = false },
    { token = "$elapsed", fg = "#6d8f89", bold = true, dim = false },
  ],
]

[theme]
# Rosé Pine Dawn, using Herdr's built-in light palette.
name = "rose-pine-dawn"
auto_switch = false
