[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#797593", dim = false }],
  [
    { token = "agent", fg = "#464261", dim = false },
    { token = "$profile", fg = "#286983", dim = false },
    { token = "$elapsed", fg = "#6d8f89", bold = true, dim = false },
    { token = "$session", fg = "#907aa9", dim = false },
  ],
]

[theme]
# Rosé Pine Dawn, using Herdr's built-in light palette.
name = "rose-pine-dawn"
auto_switch = false

[theme.custom]
# Contrast bump over the built-in palette; matches the terminal/pi tweaks.
active_row_bg = "#cfc6d9"
selection_bg = "#cfc6d9"
text = "#464261"
subtext0 = "#575279"
overlay1 = "#8b869b"
