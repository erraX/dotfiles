[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#a5adcb", dim = false }],
  [
    { token = "agent", fg = "#cad3f5", dim = false },
    { token = "$profile", fg = "#8aadf4", dim = false },
    { token = "$elapsed", fg = "#eed49f", bold = true, dim = false },
  ],
]

[theme]
# Catppuccin Macchiato; official palette (catppuccin/nvim palettes/macchiato.lua), same mapping as the Frappe fragment.
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#1e2030"
panel_bg = "#24273a"
active_row_bg = "#363a4f"
selection_bg = "#494d64"
surface0 = "#363a4f"
surface1 = "#494d64"
surface_dim = "#181926"
overlay0 = "#6e738d"
overlay1 = "#8087a2"
text = "#cad3f5"
subtext0 = "#a5adcb"
accent = "#8aadf4"
mauve = "#c6a0f6"
green = "#a6da95"
yellow = "#eed49f"
red = "#ed8796"
blue = "#8aadf4"
teal = "#8bd5ca"
peach = "#f5a97f"
