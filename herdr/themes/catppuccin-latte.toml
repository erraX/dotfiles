[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#6c6f85", dim = false }],
  [
    { token = "agent", fg = "#4c4f69", dim = false },
    { token = "$profile", fg = "#1e66f5", dim = false },
    { token = "$elapsed", fg = "#df8e1d", bold = true, dim = false },
  ],
]

[theme]
# Catppuccin Latte; official palette (catppuccin/nvim palettes/latte.lua), same mapping as the Frappe fragment.
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#e6e9ef"
panel_bg = "#eff1f5"
active_row_bg = "#ccd0da"
selection_bg = "#bcc0cc"
surface0 = "#ccd0da"
surface1 = "#bcc0cc"
surface_dim = "#dce0e8"
overlay0 = "#9ca0b0"
overlay1 = "#8c8fa1"
text = "#4c4f69"
subtext0 = "#6c6f85"
accent = "#1e66f5"
mauve = "#8839ef"
green = "#40a02b"
yellow = "#df8e1d"
red = "#d20f39"
blue = "#1e66f5"
teal = "#179299"
peach = "#fe640b"
