[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#708089", dim = false }],
  [
    { token = "agent", fg = "#5c6a72", dim = false },
    { token = "$profile", fg = "#2e7099", dim = false },
    { token = "$elapsed", fg = "#47661b", bold = true, dim = false },
  ],
]

[theme]
# Everforest Light Hard; backgrounds follow upstream with darker TUI accents.
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#f2efdf"
panel_bg = "#fffbef"
active_row_bg = "#e8e5d5"
selection_bg = "#f0f2d4"
surface0 = "#f8f5e4"
surface1 = "#f2efdf"
surface_dim = "#f2efdf"
overlay0 = "#708089"
overlay1 = "#939f91"
text = "#5c6a72"
subtext0 = "#708089"
accent = "#2e7099"
mauve = "#8f537f"
green = "#47661b"
yellow = "#8c5a00"
red = "#ad3b4a"
blue = "#2e7099"
teal = "#2c7459"
peach = "#9a5200"
