[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#cbd9d8", dim = false }],
  [
    { token = "agent", fg = "#e6eaea", dim = false },
    { token = "$profile", fg = "#a1cdd8", dim = false },
    { token = "$elapsed", fg = "#fda47f", bold = true, dim = false },
  ],
]

[theme]
# Terafox; palette from EdenEast/nightfox.nvim palette/terafox.lua.
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#0f1c1e"
panel_bg = "#152528"
active_row_bg = "#1d3337"
selection_bg = "#293e40"
surface0 = "#1d3337"
surface1 = "#254147"
surface_dim = "#0f1c1e"
overlay0 = "#587b7b"
overlay1 = "#6d7f8b"
text = "#e6eaea"
subtext0 = "#cbd9d8"
accent = "#7aa4a1"
mauve = "#ad5c7c"
green = "#7aa4a1"
yellow = "#fda47f"
red = "#e85c51"
blue = "#5a93aa"
teal = "#a1cdd8"
peach = "#ff8349"
