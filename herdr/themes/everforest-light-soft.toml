# Everforest Light Soft for Herdr.
# Backgrounds follow sainnhe/everforest; semantic accents are darkened for TUI text.

[theme]
# Everforest Light Soft; backgrounds follow upstream with darker TUI accents.
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#e5dfc5"
panel_bg = "#f3ead3"
active_row_bg = "#d8d3ba"
selection_bg = "#e1e4bd"
surface0 = "#eae4ca"
surface1 = "#e5dfc5"
surface_dim = "#e5dfc5"
overlay0 = "#708089"
overlay1 = "#939f91"
text = "#5c6a72"
subtext0 = "#708089"
accent = "#2e7099"
mauve = "#8f537f"
green = "#47661b"
yellow = "#8c5a00"
red = "#ad3b4a"
blue = "#2e7099"
teal = "#2c7459"
peach = "#9a5200"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#708089", dim = false }],
  [
    { token = "agent", fg = "#5c6a72", dim = false },
    { token = "$profile", fg = "#2e7099", dim = false },
    { token = "$elapsed", fg = "#47661b", bold = true, dim = false },
  ],
]
