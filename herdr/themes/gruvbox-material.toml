[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#a89984", dim = false }],
  [
    { token = "agent", fg = "#d4be98", dim = false },
    { token = "$profile", fg = "#a9b665", dim = false },
    { token = "$elapsed", fg = "#d8a657", bold = true, dim = false },
  ],
]

[theme]
# Gruvbox Material dark medium; palette from sainnhe/gruvbox-material autoload.
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#1b1b1b"
panel_bg = "#282828"
active_row_bg = "#3c3836"
selection_bg = "#45403d"
surface0 = "#32302f"
surface1 = "#45403d"
surface_dim = "#1b1b1b"
overlay0 = "#7c6f64"
overlay1 = "#928374"
text = "#d4be98"
subtext0 = "#a89984"
accent = "#a9b665"
mauve = "#d3869b"
green = "#a9b665"
yellow = "#d8a657"
red = "#ea6962"
blue = "#7daea3"
teal = "#89b482"
peach = "#e78a4e"
