# Everforest Dark Medium for Herdr
# Snapshot of the prior active theme; copy its theme and agent-row sections
# into config.toml to switch back from a light preset.

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#29363a"
panel_bg = "#2d353b"
active_row_bg = "#40574f"
selection_bg = "#536b61"
surface0 = "#354347"
surface1 = "#3f4f52"
surface_dim = "#243034"
overlay0 = "#576a64"
overlay1 = "#74867c"
text = "#d8d1b8"
subtext0 = "#aeb7a6"
accent = "#a7c080"
mauve = "#d699b6"
green = "#a7c080"
yellow = "#dbbc7f"
red = "#e67e80"
blue = "#7fbbb3"
teal = "#83c092"
peach = "#e69875"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [
    { token = "agent", fg = "#aab8a4", dim = false },
    { token = "$profile", fg = "#8fae9c", dim = false },
    { token = "$elapsed", fg = "#9fb57d", bold = true, dim = false },
  ],
]
