[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#8a8980", dim = false }],
  [
    { token = "agent", fg = "#545464", dim = false },
    { token = "$profile", fg = "#4d699b", dim = false },
    { token = "$elapsed", fg = "#6f894e", bold = true, dim = false },
    { token = "$session", fg = "#624c83", dim = false },
  ],
]

[theme]
# Kanagawa Lotus, using Herdr's built-in light palette.
name = "kanagawa-lotus"
auto_switch = false
