[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#a9b1d6", dim = false }],
  [
    { token = "agent", fg = "#c0caf5", dim = false },
    { token = "$profile", fg = "#7aa2f7", dim = false },
    { token = "$elapsed", fg = "#9ece6a", bold = true, dim = false },
  ],
]

[theme]
# Tokyo Night Storm, aligned with the Kitty Tokyo Night Storm theme.
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#1f2335"
panel_bg = "#24283b"
active_row_bg = "#2e3c64"
selection_bg = "#2e3c64"
surface0 = "#292e42"
surface1 = "#343b58"
surface_dim = "#1d202f"
overlay0 = "#414868"
overlay1 = "#565f89"
text = "#c0caf5"
subtext0 = "#a9b1d6"
accent = "#7aa2f7"
mauve = "#bb9af7"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
blue = "#7aa2f7"
teal = "#7dcfff"
peach = "#ff9e64"
