[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#a6a69c", dim = false }],
  [
    { token = "agent", fg = "#c5c9c5", dim = false },
    { token = "$profile", fg = "#8ba4b0", dim = false },
    { token = "$elapsed", fg = "#c4b28a", bold = true, dim = false },
  ],
]

[theme]
# Kanagawa Dragon; palette from rebelot/kanagawa.nvim colors.lua (Herdr only ships Wave/Lotus).
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#12120f"
panel_bg = "#181616"
active_row_bg = "#282727"
selection_bg = "#223249"
surface0 = "#1d1c19"
surface1 = "#282727"
surface_dim = "#12120f"
overlay0 = "#625e5a"
overlay1 = "#737c73"
text = "#c5c9c5"
subtext0 = "#a6a69c"
accent = "#8ba4b0"
mauve = "#8992a7"
green = "#87a987"
yellow = "#c4b28a"
red = "#c4746e"
blue = "#8ba4b0"
teal = "#8ea4a2"
peach = "#b6927b"
