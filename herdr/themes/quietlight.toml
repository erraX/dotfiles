# Quiet Light for Herdr
# Adapted from onecrayon/theme-quietlight-vsc. This is a theme preset only;
# copy its [theme] sections into config.toml when you want to activate it.

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#f2f2f2"
panel_bg = "#f5f5f5"
active_row_bg = "#d4e4f6"
selection_bg = "#c1f5b0"
surface0 = "#ebebeb"
surface1 = "#e0e9f6"
surface_dim = "#bec4c2"
overlay0 = "#7d8790"
overlay1 = "#aeb7c1"
text = "#333333"
subtext0 = "#626262"
accent = "#4b83cd"
mauve = "#7a3e9d"
green = "#448c27"
yellow = "#ab6526"
red = "#aa3731"
blue = "#4b83cd"
teal = "#4ec1e5"
peach = "#ab6526"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#858585", dim = false }],
  [
    { token = "agent", fg = "#666666", dim = false },
    { token = "$profile", fg = "#4b83cd", dim = false },
    { token = "$elapsed", fg = "#448c27", bold = true, dim = false },
  ],
]
