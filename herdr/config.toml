# GENERATED by theme_switcher.sh — do not edit.
# Edit config.base.toml (settings) or themes/rose-pine-dawn.toml (colors) instead.

onboarding = false
# Herdr base config — everything EXCEPT theme colors.
# `sth set <theme>` concatenates this file + themes/<theme>.toml into config.toml.
# Edit THIS file (not config.toml) for keys/ui/terminal changes; config.toml is generated.

[ui]
agent_panel_sort = "spaces"
tab_bar_right = [
  { type = "datetime", format = "%H:%M" },
  { type = "command", command = "/Users/mni/.config/herdr/agent-elapsed-tracker.sh", interval_seconds = 10, timeout_seconds = 2 },
  { type = "command", command = "/Users/mni/.config/herdr/zoom-status.sh", interval_seconds = 1, timeout_seconds = 1 },
]
tab_bar_right_separator = "  "
prompt_new_tab_name = false
window_title = "{workspace} · {tab}"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
settings = "prefix+semicolon"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+a"
rename_workspace = "prefix+m"
close_workspace = "prefix+d"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
previous_agent = "ctrl+shift+k"
next_agent = "ctrl+shift+j"
focus_agent = "prefix+alt+1..9"
new_tab = "prefix+n"
rename_tab = "prefix+comma"
previous_tab = ["prefix+[", "ctrl+shift+tab"]
next_tab = ["prefix+]", "ctrl+tab"]
copy_mode = "prefix+space"
switch_tab = "prefix+1..9"
close_tab = ""
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+p"
resize_mode = "prefix+r"
resize_pane_left = "prefix+left"
resize_pane_down = "prefix+down"
resize_pane_up = "prefix+up"
resize_pane_right = "prefix+right"
# Default is prefix+o; moved aside so prefix+o can open the agent picker below.
open_notification_target = "prefix+shift+o"

# Sidebar-style agent picker (fzf popup). The built-in session navigator
# (prefix+g) shows the whole workspace/tab/pane tree and isn't configurable;
# this one renders the same two-line rows as the sidebar agents panel.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "/Users/mni/.config/herdr/agent-picker.py"
description = "pick agent"
width = 68
height = "70%"

# Temporary tools in the focused pane's working directory; q returns to it.
# prefix+c is free because new_tab is explicitly bound to prefix+n above.
[[keys.command]]
key = "prefix+c"
type = "popup"
command = "/opt/homebrew/bin/lazygit"
description = "open lazygit"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+f"
type = "popup"
# Yazi's fzf plugin inherits its environment; refresh colors on each launch.
command = "/Users/mni/.config/themes/with-fzf-theme.sh /opt/homebrew/bin/yazi"
description = "open yazi"
width = "90%"
height = "85%"

# Disposable interactive shell; exit/Ctrl+d closes it (not a persistent toggle).
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "/Users/mni/.config/themes/with-fzf-theme.sh /bin/zsh -i"
description = "open scratch shell"
width = "85%"
height = "75%"

[experimental]
switch_ascii_input_source_in_prefix = true

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.clipboard]
enabled = true
position = "top-right"

[ui.sound]
enabled = false

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    "state_icon",
    "workspace",
    { token = "tab", fg = "#797593", dim = false },
    { token = "$summary", fg = "#6d8f89", dim = false },
  ],
  [
    { token = "agent", fg = "#464261", dim = false },
    { token = "$profile", fg = "#286983", dim = false },
    { token = "$elapsed", fg = "#6d8f89", bold = true, dim = false },
    { token = "$session", fg = "#907aa9", dim = false },
  ],
]

[theme]
# Rosé Pine Dawn, using Herdr's built-in light palette.
name = "rose-pine-dawn"
auto_switch = false

[theme.custom]
# Built-in gold #ea9d34 is 2.05:1 on the base; ochre matches the terminal
# palette 3/11, pi, nvim, lazygit, yazi and delta (see themes/README.md).
yellow = "#a46d24"
