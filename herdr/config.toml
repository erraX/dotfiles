# GENERATED by theme_switcher.sh — do not edit.
# Edit config.base.toml (settings) or themes/tokyonight.toml (colors) instead.

# Herdr base config — everything EXCEPT theme colors.
# `sth set <theme>` concatenates this file + themes/<theme>.toml into config.toml.
# Edit THIS file (not config.toml) for keys/ui/terminal changes; config.toml is generated.

[ui]
agent_panel_sort = "spaces"
tab_bar_right = [
  { type = "datetime", format = "%H:%M" },
  { type = "command", command = "/Users/mni/.config/herdr/agent-elapsed-tracker.sh", interval_seconds = 10, timeout_seconds = 2 },
  { type = "command", command = "/Users/mni/.config/herdr/zoom-status.sh", interval_seconds = 1, timeout_seconds = 1 },
]
tab_bar_right_separator = "  "
prompt_new_tab_name = false
window_title = "{workspace} · {tab}"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
settings = "prefix+semicolon"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+a"
rename_workspace = "prefix+m"
close_workspace = "prefix+d"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
previous_agent = "ctrl+shift+k"
next_agent = "ctrl+shift+j"
focus_agent = "prefix+alt+1..9"
new_tab = "prefix+n"
rename_tab = "prefix+comma"
previous_tab = ["prefix+[", "ctrl+shift+tab"]
next_tab = ["prefix+]", "ctrl+tab"]
copy_mode = "prefix+space"
switch_tab = "prefix+1..9"
close_tab = ""
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+p"
resize_mode = "prefix+r"
resize_pane_left = "prefix+left"
resize_pane_down = "prefix+down"
resize_pane_up = "prefix+up"
resize_pane_right = "prefix+right"

[experimental]
switch_ascii_input_source_in_prefix = true

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.clipboard]
enabled = true
position = "top-right"

[ui.sound]
enabled = false

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#a9b1d6", dim = false }],
  [
    { token = "agent", fg = "#c0caf5", dim = false },
    { token = "$profile", fg = "#7aa2f7", dim = false },
    { token = "$elapsed", fg = "#9ece6a", bold = true, dim = false },
  ],
]

[theme]
# Tokyo Night Storm, aligned with the Kitty Tokyo Night Storm theme.
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#1f2335"
panel_bg = "#24283b"
active_row_bg = "#2e3c64"
selection_bg = "#2e3c64"
surface0 = "#292e42"
surface1 = "#343b58"
surface_dim = "#1d202f"
overlay0 = "#414868"
overlay1 = "#565f89"
text = "#c0caf5"
subtext0 = "#a9b1d6"
accent = "#7aa2f7"
mauve = "#bb9af7"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
blue = "#7aa2f7"
teal = "#7dcfff"
peach = "#ff9e64"
