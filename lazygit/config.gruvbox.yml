git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --line-numbers --syntax-theme=GitHub
gui:
  theme:
    # Borders
    activeBorderColor:
      - "#83a598"   # blue
      - bold
    inactiveBorderColor:
      - "#3c3836"   # bg1 (surface)

    # Panels / text
    defaultFgColor:
      - "#d5c4a1"   # fg1
    optionsTextColor:
      - "#8ec07c"   # aqua

    # Selection / focus
    selectedLineBgColor:
      - "#3c3836"   # bg1
    selectedRangeBgColor:
      - "#32302f"   # bg0 (soft)

    # Git states
    unstagedChangesColor:
      - "#fb4934"   # red
    cherryPickedCommitBgColor:
      - "#3c3836"   # bg1
    cherryPickedCommitFgColor:
      - "#b8bb26"   # green

    # Search highlight
    searchingActiveBorderColor:
      - "#fabd2f"   # yellow
      - bold

  # Optional: readable author colors on Gruvbox Dark Soft
  authorColors:
    "*": "#d5c4a1"
    "default": "#d5c4a1"
    "A": "#83a598"  # blue
    "B": "#8ec07c"  # aqua
    "C": "#b8bb26"  # green
    "D": "#fabd2f"  # yellow
    "E": "#fe8019"  # orange
    "F": "#d3869b"  # purple
    "G": "#fb4934"  # red
    "H": "#fb4934"  # red (alt)
