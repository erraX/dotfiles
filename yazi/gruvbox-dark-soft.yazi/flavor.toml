# vim:fileencoding=utf-8
# Gruvbox Dark Soft flavor for Yazi
# Sources: https://github.com/morhetz/gruvbox

# Palette reference (soft variant):
#   bg0_s  #32302f   fg0  #fbf1c7   red     #cc241d / #fb4934
#   bg1    #3c3836   fg1  #ebdbb2   green   #98971a / #b8bb26
#   bg2    #504945   fg2  #d5c4a1   yellow  #d79921 / #fabd2f
#   bg3    #665c54   fg3  #bdae93   blue    #458588 / #83a598
#   bg4    #7c6f64   fg4  #a89984   purple  #b16286 / #d3869b
#   gray   #928374                   aqua    #689d6a / #8ec07c
#                                    orange  #d65d0e / #fe8019

# -----------------------------------------------------------------------------
# App
# -----------------------------------------------------------------------------
[app]
overall = { bg = "#32302f" }

# -----------------------------------------------------------------------------
# Manager
# -----------------------------------------------------------------------------
[mgr]
cwd            = { fg = "#d3869b" }
find_keyword   = { fg = "#fabd2f", bold = true, underline = true }
find_position  = { fg = "#83a598", bg = "reset", bold = true }

# Markers (copied/cut/selected)
marker_copied   = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut      = { fg = "#fb4934", bg = "#fb4934" }
marker_marked   = { fg = "#83a598", bg = "#83a598" }
marker_selected = { fg = "#fabd2f", bg = "#fabd2f" }

# Counts (numbers shown on markers)
count_copied   = { fg = "#32302f", bg = "#b8bb26", bold = true }
count_cut      = { fg = "#32302f", bg = "#fb4934", bold = true }
count_selected = { fg = "#32302f", bg = "#fabd2f", bold = true }

# Border
border_symbol = "│"
border_style  = { fg = "#665c54" }

# -----------------------------------------------------------------------------
# Indicator bars (left side bars in panes)
# -----------------------------------------------------------------------------
[indicator]
parent  = { fg = "#a89984", bg = "#3c3836" }
current = { fg = "#d3869b", bg = "#3c3836" }
preview = { fg = "#ebdbb2", bg = "#3c3836" }
padding = { open = " ", close = " " }

# -----------------------------------------------------------------------------
# Tabs
# -----------------------------------------------------------------------------
[tabs]
active   = { fg = "#32302f", bg = "#d3869b", bold = true }
inactive = { fg = "#d3869b", bg = "#3c3836" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = " ", close = " " }

# -----------------------------------------------------------------------------
# Mode (normal/select/unset)
# -----------------------------------------------------------------------------
[mode]
normal_main = { fg = "#32302f", bg = "#83a598", bold = true }
normal_alt  = { fg = "#83a598", bg = "#3c3836" }

select_main = { fg = "#32302f", bg = "#b8bb26", bold = true }
select_alt  = { fg = "#b8bb26", bg = "#3c3836" }

unset_main  = { fg = "#32302f", bg = "#fabd2f", bold = true }
unset_alt   = { fg = "#fabd2f", bg = "#3c3836" }

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------
[status]
overall = { fg = "#ebdbb2", bg = "#3c3836" }

sep_left  = { open = " ", close = " " }
sep_right = { open = " ", close = " " }

perm_sep   = { fg = "#665c54" }
perm_type  = { fg = "#ebdbb2", bold = true }
perm_read  = { fg = "#b8bb26" }
perm_write = { fg = "#fb4934" }
perm_exec  = { fg = "#fabd2f" }

progress_label  = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#ebdbb2", bg = "#504945" }
progress_error  = { fg = "#ebdbb2", bg = "#cc241d" }

# -----------------------------------------------------------------------------
# Which-key popup
# -----------------------------------------------------------------------------
[which]
cols = 2
mask = { bg = "#3c3836" }
cand = { fg = "#fabd2f", bold = true }
rest = { fg = "#a89984" }
desc = { fg = "#d5c4a1" }
separator = " -> "
separator_style = { fg = "#665c54" }

# -----------------------------------------------------------------------------
# Confirm dialog
# -----------------------------------------------------------------------------
[confirm]
border = { fg = "#665c54" }
title  = { fg = "#d3869b", bold = true }
body   = { fg = "#ebdbb2" }
list   = { fg = "#ebdbb2" }
btn_yes = { fg = "#32302f", bg = "#83a598", bold = true }
btn_no  = { fg = "#ebdbb2", bg = "#504945" }
btn_labels = [" Yes ", " No "]

# -----------------------------------------------------------------------------
# Input
# -----------------------------------------------------------------------------
[input]
border   = { fg = "#665c54" }
title    = { fg = "#ebdbb2", bold = true }
value    = { fg = "#ebdbb2" }
selected = { bg = "#504945" }

# -----------------------------------------------------------------------------
# Pick
# -----------------------------------------------------------------------------
[pick]
border   = { fg = "#665c54" }
active   = { fg = "#fabd2f", bold = true }
inactive = { fg = "#a89984" }

# -----------------------------------------------------------------------------
# Spotter
# -----------------------------------------------------------------------------
[spot]
border   = { fg = "#665c54" }
title    = { fg = "#d3869b", bold = true }
tbl_col  = { fg = "#83a598" }
tbl_cell = { fg = "#ebdbb2", bg = "#504945" }

# -----------------------------------------------------------------------------
# Notify
# -----------------------------------------------------------------------------
[notify]
title_info  = { fg = "#83a598", bold = true }
title_warn  = { fg = "#fabd2f", bold = true }
title_error = { fg = "#fb4934", bold = true }

# -----------------------------------------------------------------------------
# Filetype coloring
# -----------------------------------------------------------------------------
[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#8ec07c" },

  # Audio / Video
  { mime = "{audio,video}/*", fg = "#fabd2f" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d3869b" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#b8bb26" },

  # VFS states
  { mime = "vfs/{absent,stale}", fg = "#928374" },

  # Directories
  { url = "*/", fg = "#83a598", bold = true },

  # Fallback
  { url = "*", fg = "#ebdbb2" },
]
