# vim:ft=kitty

## name: Everforest Dark Medium
## author: Sainnhe Park
## blurb: A green-based color scheme designed to be warm and easy on the eyes.

# The basic colors

foreground                      #d3c6aa
background                      #2d353b
selection_foreground            #d3c6aa
selection_background            #543a48

# Cursor colors

cursor                          #d3c6aa
cursor_text_color               #2d353b

# URL underline color when hovering with mouse

url_color                       #7fbbb3

# Kitty window border colors and terminal bell colors

active_border_color             #56635f
inactive_border_color           #475258
bell_border_color               #e67e80
visual_bell_color               none

# OS Window titlebar colors

wayland_titlebar_color          #2d353b
macos_titlebar_color            #2d353b

# Tab bar colors

active_tab_foreground           #2d353b
active_tab_background           #a7c080
inactive_tab_foreground         #9da9a0
inactive_tab_background         #343f44
tab_bar_background              #232a2e

# Colors for marks (marked text in the terminal)

mark1_foreground                #2d353b
mark1_background                #7fbbb3
mark2_foreground                #2d353b
mark2_background                #d699b6
mark3_foreground                #2d353b
mark3_background                #83c092

