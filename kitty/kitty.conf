# vim:fileencoding=utf-8:foldmethod=marker

# ===== Fonts ===== {{{

# Previous font configuration: Ubuntu Sans Mono
# font_family      family="UbuntuSansMono Nerd Font Mono" style=Regular
# bold_font        family="UbuntuSansMono Nerd Font Mono" style=Regular
# italic_font      family="UbuntuSansMono Nerd Font Mono" style=Italic
# bold_italic_font family="UbuntuSansMono Nerd Font Mono" style=Italic

font_family      family="Iosevka Term" style=Light
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0
disable_ligatures cursor

# }}}

# ===== Cursor ===== {{{

cursor_shape beam
cursor_blink_interval 0

# }}}

# ===== Scrollback ===== {{{

scrollback_lines 10000
scrollback_pager_history_size 100

# }}}

# ===== Mouse ===== {{{

copy_on_select clipboard
mouse_hide_wait 3.0
url_style curly
open_url_with default
detect_urls yes
strip_trailing_spaces smart

# }}}

# ===== Terminal bell ===== {{{

enable_audio_bell no
visual_bell_duration 0

# }}}

# ===== Window layout ===== {{{

enabled_layouts splits,stack
window_padding_width 4
window_border_width 1pt
active_border_color #d65d0e
inactive_border_color #3c3836
confirm_os_window_close 2
hide_window_decorations titlebar-only

# }}}

# ===== Tab bar ===== {{{

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index}: {title} "
active_tab_font_style bold

# }}}

# ===== OS specific ===== {{{

macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_titlebar_color background

# }}}

# ===== Advanced ===== {{{

shell_integration enabled
allow_remote_control socket-only
listen_on unix:/tmp/kitty

scrollback_lines 10000
scrollback_pager_history_size 100
# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# }}}

# ===== Keyboard shortcuts ===== {{{

# Prefix: ctrl+a (tmux style)

# -- Splits / Windows --
map ctrl+a>v        launch --location=vsplit --cwd=current
map ctrl+a>s        launch --location=hsplit --cwd=current
map ctrl+a>x        close_window_with_confirmation
map ctrl+a>c        launch --cwd=current

# -- Navigate splits --
map ctrl+a>h        neighboring_window left
map ctrl+a>l        neighboring_window right
map ctrl+a>k        neighboring_window up
map ctrl+a>j        neighboring_window down

# -- Pass agent navigation through to Herdr --
map ctrl+shift+k
map ctrl+shift+j

# -- Smart navigation with Neovim --
# Outside Neovim, bare <C-hjkl> moves between kitty windows.
# Inside Neovim, smart-splits.nvim sets IS_NVIM and kitty passes the keys through.
# map ctrl+h          neighboring_window left
# map ctrl+l          neighboring_window right
# map ctrl+k          neighboring_window up
# map ctrl+j          neighboring_window down
# map --when-focus-on var:IS_NVIM ctrl+h
# map --when-focus-on var:IS_NVIM ctrl+l
# map --when-focus-on var:IS_NVIM ctrl+k
# map --when-focus-on var:IS_NVIM ctrl+j

# -- Move/swap splits --
map ctrl+a>shift+h      move_window left
map ctrl+a>shift+l      move_window right
map ctrl+a>shift+k      move_window up
map ctrl+a>shift+j      move_window down

# -- Resize splits --
map ctrl+a>left     resize_window narrower 2
map ctrl+a>right    resize_window wider 2
map ctrl+a>up       resize_window taller 2
map ctrl+a>down     resize_window shorter 2

# -- Toggle zoom (stack layout) --
map ctrl+a>p        toggle_layout stack

# -- Tabs (tmux calls them "windows") --
map ctrl+a>t        no_op
# map ctrl+a>n        next_tab
# map ctrl+a>p        previous_tab
map ctrl+a>1        goto_tab 1
map ctrl+a>2        goto_tab 2
map ctrl+a>3        goto_tab 3
map ctrl+a>4        goto_tab 4
map ctrl+a>5        goto_tab 5
map ctrl+a>6        goto_tab 6
map ctrl+a>7        goto_tab 7
map ctrl+a>8        goto_tab 8
map ctrl+a>9        goto_tab 9
map ctrl+a>,        set_tab_title

# -- Send ctrl+a to terminal (press ctrl+a twice) --
map ctrl+a>ctrl+a   send_key ctrl+a

# -- Scrollback --
map ctrl+a>[        show_scrollback
map cmd+k           clear_terminal scrollback active

# -- Font size --
map cmd+equal       change_font_size all +1.0
map cmd+minus       change_font_size all -1.0
map cmd+0           change_font_size all 0

# -- Misc --
map cmd+,           edit_config_file
map ctrl+a>shift+,  load_config_file

# }}}

# ===== Theme (keep at bottom) ===== {{{

include current_theme.conf

# }}}

paste_actions replace-dangerous-control-codes

env LESSUTFCHARDEF=23fb-23fe:p,2665:p,26a1:p,2b58:p,e000-e00a:p,e0a0-e0a2:p,e0a3:p,e0b0-e0b3:p,e0b4-e0c8:p,e0ca:p,e0cc-e0d4:p,e200-e2a9:p,e300-e3e3:p,e5fa-e6a6:p,e700-e7c5:p,ea60-ebeb:p,f000-f2e0:p,f300-f32f:p,f400-f532:p,f500-fd46:p,f0001-f1af0:p
